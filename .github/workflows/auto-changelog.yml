name: Automated Changelog Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - "CHANGELOG.md"
      - ".github/workflows/auto-changelog.yml"

jobs:
  update-changelog:
    name: Generate and Update CHANGELOG.md
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Changelog from Conventional Commits
        id: changelog
        run: |
          node -e "
          const fs = require('fs');
          const { execSync } = require('child_process');

          try {
            const rawCommits = execSync('git log --pretty=format:\"%h|%s|%an|%ad\" --date=short -n 50', { encoding: 'utf8' }).trim().split('\n');
            
            const categories = {
              feat: [],
              fix: [],
              perf: [],
              refactor: [],
              docs: [],
              test: [],
              chore: []
            };

            for (const line of rawCommits) {
              const [hash, subject, author, date] = line.split('|');
              if (!subject) continue;

              const match = subject.match(/^([a-z]+)(\([a-z0-9-_.]+\))?:\s*(.+)$/i);
              if (match) {
                const type = match[1].toLowerCase();
                const scope = match[2] ? match[2].slice(1, -1) : '';
                const desc = match[3];

                if (categories[type]) {
                  categories[type].push({ hash, scope, desc, author, date });
                } else {
                  categories.chore.push({ hash, scope, desc, author, date });
                }
              }
            }

            let newSection = '## [Unreleased] - ' + new Date().toISOString().split('T')[0] + '\n\n';

            if (categories.feat.length) {
              newSection += '### Added\n';
              categories.feat.forEach(c => {
                newSection += '- ' + (c.scope ? '**' + c.scope + '**: ' : '') + c.desc + ' ([' + c.hash + '])\n';
              });
              newSection += '\n';
            }

            if (categories.fix.length) {
              newSection += '### Fixed\n';
              categories.fix.forEach(c => {
                newSection += '- ' + (c.scope ? '**' + c.scope + '**: ' : '') + c.desc + ' ([' + c.hash + '])\n';
              });
              newSection += '\n';
            }

            if (categories.perf.length) {
              newSection += '### Performance\n';
              categories.perf.forEach(c => {
                newSection += '- ' + (c.scope ? '**' + c.scope + '**: ' : '') + c.desc + ' ([' + c.hash + '])\n';
              });
              newSection += '\n';
            }

            if (categories.refactor.length) {
              newSection += '### Refactored\n';
              categories.refactor.forEach(c => {
                newSection += '- ' + (c.scope ? '**' + c.scope + '**: ' : '') + c.desc + ' ([' + c.hash + '])\n';
              });
              newSection += '\n';
            }

            if (categories.docs.length) {
              newSection += '### Documentation\n';
              categories.docs.forEach(c => {
                newSection += '- ' + (c.scope ? '**' + c.scope + '**: ' : '') + c.desc + ' ([' + c.hash + '])\n';
              });
              newSection += '\n';
            }

            let currentContent = '';
            if (fs.existsSync('CHANGELOG.md')) {
              currentContent = fs.readFileSync('CHANGELOG.md', 'utf8');
            }

            const header = '# Changelog\n\nAll notable changes to the **CollabWrite** project are documented in this file.\n\nThe format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/), and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n\n---\n\n';

            // Strip existing header if present
            let body = currentContent.replace(/^# Changelog[\s\S]*?---\s*\n*/i, '');

            // Ensure we do not duplicate identical sections
            if (!body.includes(newSection.trim())) {
              const updated = header + newSection + body;
              fs.writeFileSync('CHANGELOG.md', updated, 'utf8');
              console.log('CHANGELOG.md updated successfully.');
            } else {
              console.log('No new changelog entries to append.');
            }
          } catch (err) {
            console.error('Error generating changelog:', err);
            process.exit(1);
          }
          "

      - name: Commit and Push Updated CHANGELOG.md
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q "CHANGELOG.md"; then
            git add CHANGELOG.md
            git commit -m "docs(changelog): auto-update CHANGELOG.md based on conventional commits [skip ci]"
            git push origin main
          else
            echo "No changes in CHANGELOG.md to commit."
          fi
